<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matches</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --text: #1c2333;
    --muted: #6b7488;
    --border: #e2e6ef;
    --accent: #2563eb;
    --warn: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1420;
      --card: #181f2e;
      --text: #e8ecf5;
      --muted: #8b95aa;
      --border: #2a3347;
      --accent: #60a5fa;
      --warn: #fbbf24;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
  }
  .wrap { max-width: 600px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 8px 0 4px; }
  h2 { font-size: 1.1rem; margin: 24px 0 8px; }
  h3 {
    font-size: .75rem; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); font-weight: 600; margin: 16px 0 6px;
  }
  .sub { color: var(--muted); font-size: .85rem; margin-bottom: 8px; min-height: 1em; }

  /* Page switcher */
  .nav { display: flex; gap: 8px; margin: 4px 0 12px; }
  .nav a {
    flex: 1;
    text-align: center;
    text-decoration: none;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--muted);
    font-size: .95rem;
  }
  .nav a:hover { color: var(--text); }
  .nav a.active { background: #2563eb; border-color: #2563eb; color: #fff; font-weight: 600; }

  /* League tabs */
  .tabs { display: flex; gap: 6px; margin-top: 16px; }
  .tabs button {
    font: inherit; font-size: .85rem; cursor: pointer;
    padding: 6px 14px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--card); color: var(--muted);
  }
  .tabs button[aria-selected="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .m {
    display: grid;
    grid-template-columns: 28px 1fr auto 1fr;
    align-items: center;
    gap: 8px;
    padding: 12px 12px;
    font-variant-numeric: tabular-nums;
  }
  .m + .m { border-top: 1px solid var(--border); }
  .num { color: var(--muted); font-size: .75rem; }
  .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t.home { text-align: right; }
  .t.win { font-weight: 700; }
  .t.lose { color: var(--muted); }
  .t.tbd { color: var(--muted); font-style: italic; }
  .score {
    min-width: 56px; text-align: center; font-weight: 700;
    padding: 3px 8px; border-radius: 6px; background: var(--bg);
  }
  .score.pending { color: var(--muted); font-weight: 400; font-size: .8rem; }
  .count { color: var(--muted); font-size: .8rem; font-weight: 400; margin-left: 6px; }

  .msg { color: var(--muted); padding: 24px 0; text-align: center; }
  .warn { color: var(--warn); font-size: .8rem; margin-top: 12px; }
  .note { color: var(--muted); font-size: .75rem; margin-top: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <a href="index.html">Tables</a>
    <a href="brackets.html">Bracket</a>
    <a href="matches.html" class="active" aria-current="page">Matches</a>
  </nav>
  <h1>📅 All Matches</h1>
  <div class="sub" id="updated"></div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div id="out"><div class="msg">Loading…</div></div>
  <div class="warn" id="warn" hidden></div>
  <div class="note">Scores come from matches.csv. Leave both scores blank for matches not played yet.</div>
</div>

<script>
  const CSV_FILE = "matches.csv";
  const out = document.getElementById("out");
  const tabs = document.getElementById("tabs");
  const warnBox = document.getElementById("warn");

  // Minimal CSV parser: quoted fields, "" escapes, CRLF
  function parseCSV(text) {
    const rows = [];
    let row = [], field = "", inQuotes = false;
    text = text.replace(/^﻿/, "");
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
        else if (c === '"') inQuotes = false;
        else field += c;
      } else if (c === '"') inQuotes = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(field); field = "";
        rows.push(row); row = [];
      } else field += c;
    }
    if (field !== "" || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function showError(msg) {
    out.textContent = "";
    const d = document.createElement("div");
    d.className = "msg";
    d.textContent = msg;
    out.appendChild(d);
  }

  // blank -> null, valid integer -> number, anything else -> NaN (invalid)
  function toScore(v) {
    const s = String(v || "").trim();
    if (s === "") return null;
    return /^\d{1,3}$/.test(s) ? parseInt(s, 10) : NaN;
  }

  const isPlaceholder = name => /^(\d+(st|nd|rd|th) place|winner\b|tbd$)/i.test(name);

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;   // textContent only: CSV data is never parsed as HTML
    return e;
  }

  function matchRow(m, n) {
    const row = el("div", "m");
    const played = m.s1 !== null && m.s2 !== null;
    const res = played ? Math.sign(m.s1 - m.s2) : 0;

    const cls = (name, side) => "t" + (side === "home" ? " home" : "") +
      (isPlaceholder(name) ? " tbd" : "") +
      (played && res !== 0 ? ((side === "home" ? res > 0 : res < 0) ? " win" : " lose") : "");

    row.append(
      el("span", "num", n),
      el("span", cls(m.t1, "home"), m.t1 || "TBD"),
      el("span", "score" + (played ? "" : " pending"), played ? m.s1 + " – " + m.s2 : "vs"),
      el("span", cls(m.t2, "away"), m.t2 || "TBD")
    );
    return row;
  }

  function build(rows) {
    const header = rows.shift().map(h => h.trim().toLowerCase());
    const col = k => header.indexOf(k);
    const c = { league: col("league"), stage: col("stage"), t1: col("team1"), s1: col("score1"), t2: col("team2"), s2: col("score2") };
    if (Object.values(c).some(i => i < 0)) {
      showError("matches.csv must have the header: league,stage,team1,score1,team2,score2");
      return;
    }

    // league -> stage -> [matches], keeping order of first appearance
    const leagues = new Map();
    const skipped = [];
    rows.forEach((r, i) => {
      const line = i + 2;
      if (r.every(x => x.trim() === "")) return;
      const league = (r[c.league] || "").trim();
      const stage = (r[c.stage] || "").trim() || "Matches";
      const s1 = toScore(r[c.s1]), s2 = toScore(r[c.s2]);
      if (!league || Number.isNaN(s1) || Number.isNaN(s2)) { skipped.push(line); return; }
      if (!leagues.has(league)) leagues.set(league, new Map());
      const stages = leagues.get(league);
      if (!stages.has(stage)) stages.set(stage, []);
      stages.get(stage).push({ t1: (r[c.t1] || "").trim(), s1, t2: (r[c.t2] || "").trim(), s2 });
    });

    if (skipped.length) {
      warnBox.hidden = false;
      warnBox.textContent = "⚠ Skipped invalid CSV line(s): " + skipped.join(", ") +
        " (league is required; scores must be whole numbers or blank)";
    }

    if (leagues.size === 0) { showError("No matches yet."); return; }

    const names = [...leagues.keys()];
    let current;
    try { current = localStorage.getItem("matchesLeague"); } catch (e) {}
    if (!names.includes(current)) current = names[0];

    function render() {
      out.textContent = "";
      tabs.textContent = "";
      names.forEach(name => {
        const b = el("button", "", name);
        b.setAttribute("role", "tab");
        b.setAttribute("aria-selected", String(name === current));
        b.onclick = () => {
          current = name;
          try { localStorage.setItem("matchesLeague", name); } catch (e) {}
          render();
        };
        tabs.appendChild(b);
      });

      const stages = leagues.get(current);
      let total = 0, done = 0;
      stages.forEach(list => list.forEach(m => { total++; if (m.s1 !== null && m.s2 !== null) done++; }));
      const h2 = el("h2", "", current);
      h2.appendChild(el("span", "count", done + " of " + total + " played"));
      out.appendChild(h2);

      stages.forEach((list, stage) => {
        out.appendChild(el("h3", "", stage));
        const card = el("div", "card");
        list.forEach((m, i) => card.appendChild(matchRow(m, i + 1)));
        out.appendChild(card);
      });
    }
    render();
  }

  fetch(CSV_FILE, { cache: "no-cache" })
    .then(res => {
      if (!res.ok) throw new Error("HTTP " + res.status);
      const lm = res.headers.get("Last-Modified");
      if (lm) {
        const dt = new Date(lm);
        if (!isNaN(dt)) {
          document.getElementById("updated").textContent =
            "Last updated: " + dt.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
        }
      }
      return res.text();
    })
    .then(text => build(parseCSV(text)))
    .catch(() => showError(
      "Could not load " + CSV_FILE + ". If you opened this file directly, serve it over http(s) instead (e.g. GitHub Pages)."
    ));
</script>
</body>
</html>
