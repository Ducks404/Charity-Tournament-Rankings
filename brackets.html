<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knockout Bracket</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --text: #1c2333;
    --muted: #6b7488;
    --border: #e2e6ef;
    --line: #c3cada;
    --accent: #2563eb;
    --gold: #f5b301;
    --warn: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1420;
      --card: #181f2e;
      --text: #e8ecf5;
      --muted: #8b95aa;
      --border: #2a3347;
      --line: #3a4560;
      --accent: #60a5fa;
      --warn: #fbbf24;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
  }
  .wrap { max-width: 600px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 8px 0 4px; }
  .sub { color: var(--muted); font-size: .85rem; margin-bottom: 8px; min-height: 1em; }

  /* Page switcher */
  .nav { display: flex; gap: 8px; margin: 4px 0 12px; }
  .nav a {
    flex: 1;
    text-align: center;
    text-decoration: none;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--muted);
    font-size: .95rem;
  }
  .nav a:hover { color: var(--text); }
  .nav a.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

  /* Bracket */
  .heads, .bracket { display: grid; grid-template-columns: 1fr 32px 1fr; }
  .heads { margin-top: 20px; }
  .heads div { font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding-bottom: 8px; }
  .heads div:nth-child(3) { grid-column: 3; }
  .bracket { align-items: center; }
  .semis { display: flex; flex-direction: column; gap: 24px; }
  .connector {
    align-self: stretch;
    margin: 36px 0;                 /* half of a match card's height */
    width: 16px;
    border: 2px solid var(--line);
    border-left: none;
    border-radius: 0 6px 6px 0;
    position: relative;
  }
  .connector::after {
    content: "";
    position: absolute;
    left: 100%; top: 50%;
    width: 16px; height: 2px;
    margin-top: -1px;
    background: var(--line);
  }
  .match {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .side {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    height: 36px; padding: 0 10px;
    font-variant-numeric: tabular-nums;
  }
  .side + .side { border-top: 1px solid var(--border); }
  .side .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side .score { font-weight: 700; min-width: 1.2em; text-align: right; }
  .side.win { font-weight: 700; }
  .side.win .name::before { content: "✓ "; color: var(--accent); }
  .side.lose { color: var(--muted); }
  .side.tbd .name { color: var(--muted); font-style: italic; }
  .tag { font-size: .65rem; color: var(--muted); font-weight: 400; margin-left: 6px; }

  .champ {
    margin-top: 24px; text-align: center;
    background: var(--card); border: 1px solid var(--gold); border-radius: 12px;
    padding: 16px; font-size: 1.1rem; font-weight: 700;
  }
  .msg { color: var(--muted); padding: 24px 0; text-align: center; }
  .warn { color: var(--warn); font-size: .8rem; margin-top: 12px; }
  .note { color: var(--muted); font-size: .75rem; margin-top: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <a href="index.html">Tables</a>
    <a href="bracket.html" class="active" aria-current="page">Bracket</a>
  </nav>
  <h1>🏆 Knockout Bracket</h1>
  <div class="sub" id="updated"></div>
  <div id="out"><div class="msg">Loading…</div></div>
  <div class="warn" id="warn" hidden></div>
  <div class="note">Higher score wins. Tied matches use the "winner" column. The final fills itself from the semifinal winners.</div>
</div>

<script>
  const CSV_FILE = "brackets.csv";
  const out = document.getElementById("out");
  const warnBox = document.getElementById("warn");

  // Minimal CSV parser: quoted fields, "" escapes, CRLF
  function parseCSV(text) {
    const rows = [];
    let row = [], field = "", inQuotes = false;
    text = text.replace(/^\uFEFF/, "");
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
        else if (c === '"') inQuotes = false;
        else field += c;
      } else if (c === '"') inQuotes = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(field); field = "";
        rows.push(row); row = [];
      } else field += c;
    }
    if (field !== "" || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function showError(msg) {
    out.textContent = "";
    const d = document.createElement("div");
    d.className = "msg";
    d.textContent = msg;
    out.appendChild(d);
  }

  // blank -> null, valid integer -> number, anything else -> NaN (invalid)
  function toScore(v) {
    const s = String(v || "").trim();
    if (s === "") return null;
    return /^\d{1,3}$/.test(s) ? parseInt(s, 10) : NaN;
  }

  // Returns 1, 2, or 0 (undecided)
  function winnerOf(m) {
    if (m.s1 === null || m.s2 === null) return 0;
    if (m.s1 > m.s2) return 1;
    if (m.s2 > m.s1) return 2;
    const w = (m.winner || "").trim().toLowerCase();
    if (w && w === m.t1.trim().toLowerCase()) return 1;
    if (w && w === m.t2.trim().toLowerCase()) return 2;
    return 0;
  }

  function teamOf(m, side) {
    const w = winnerOf(m);
    return w ? (w === 1 ? m.t1 : m.t2) : "";
  }

  function matchCard(m) {
    const w = winnerOf(m);
    const tied = m.s1 !== null && m.s1 === m.s2;
    const card = document.createElement("div");
    card.className = "match";
    [[m.t1, m.s1, 1], [m.t2, m.s2, 2]].forEach(([name, score, n]) => {
      const row = document.createElement("div");
      row.className = "side" + (w === n ? " win" : w ? " lose" : "") + (name ? "" : " tbd");
      const nm = document.createElement("span");
      nm.className = "name";
      nm.textContent = name || "TBD";
      if (w === n && tied) {
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = "(tiebreak)";
        nm.appendChild(tag);
      }
      const sc = document.createElement("span");
      sc.className = "score";
      sc.textContent = score === null ? "–" : score;
      row.append(nm, sc);
      card.appendChild(row);
    });
    return card;
  }

  function build(rows) {
    const header = rows.shift().map(h => h.trim().toLowerCase());
    const col = k => header.indexOf(k);
    const c = { match: col("match"), t1: col("team1"), s1: col("score1"), t2: col("team2"), s2: col("score2"), winner: col("winner") };
    if (Object.values(c).some(i => i < 0)) {
      showError("bracket.csv must have the header: match,team1,score1,team2,score2,winner");
      return;
    }

    const matches = {};
    const skipped = [];
    rows.forEach((r, i) => {
      const line = i + 2;
      if (r.every(x => x.trim() === "")) return;
      const id = (r[c.match] || "").trim().toUpperCase();
      const s1 = toScore(r[c.s1]), s2 = toScore(r[c.s2]);
      if (!["SF1", "SF2", "F"].includes(id) || Number.isNaN(s1) || Number.isNaN(s2) || matches[id]) {
        skipped.push(line);
        return;
      }
      matches[id] = {
        t1: (r[c.t1] || "").trim(), s1,
        t2: (r[c.t2] || "").trim(), s2,
        winner: (r[c.winner] || "").trim()
      };
    });

    if (skipped.length) {
      warnBox.hidden = false;
      warnBox.textContent = "⚠ Skipped invalid CSV line(s): " + skipped.join(", ") +
        " (match must be SF1, SF2 or F, once each; scores must be whole numbers)";
    }

    const blank = () => ({ t1: "", s1: null, t2: "", s2: null, winner: "" });
    const sf1 = matches.SF1 || blank();
    const sf2 = matches.SF2 || blank();
    const fin = matches.F || blank();

    // Final teams come from semifinal winners unless the CSV overrides them
    if (!fin.t1) fin.t1 = teamOf(sf1);
    if (!fin.t2) fin.t2 = teamOf(sf2);

    out.textContent = "";

    const heads = document.createElement("div");
    heads.className = "heads";
    heads.innerHTML = "<div>Semifinals</div><div></div><div>Final</div>";

    const bracket = document.createElement("div");
    bracket.className = "bracket";
    const semis = document.createElement("div");
    semis.className = "semis";
    semis.append(matchCard(sf1), matchCard(sf2));
    const conn = document.createElement("div");
    conn.className = "connector";
    bracket.append(semis, conn, matchCard(fin));

    out.append(heads, bracket);

    const fw = winnerOf(fin);
    if (fw) {
      const champ = document.createElement("div");
      champ.className = "champ";
      champ.textContent = "🏆 Champion: " + (fw === 1 ? fin.t1 : fin.t2);
      out.appendChild(champ);
    }
  }

  fetch(CSV_FILE, { cache: "no-cache" })
    .then(res => {
      if (!res.ok) throw new Error("HTTP " + res.status);
      const lm = res.headers.get("Last-Modified");
      if (lm) {
        const dt = new Date(lm);
        if (!isNaN(dt)) {
          document.getElementById("updated").textContent =
            "Last updated: " + dt.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
        }
      }
      return res.text();
    })
    .then(text => build(parseCSV(text)))
    .catch(() => showError(
      "Could not load " + CSV_FILE + ". If you opened this file directly, serve it over http(s) instead (e.g. GitHub Pages)."
    ));
</script>
</body>
</html>
